<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kittyrest</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="login.js" defer></script>
</head>
<body>

  <header>
        <nav class="navbar">
            
            <div class="logo">
                <a href="home.html">Kittyrest</a>
                <img src="logo.svg" alt="Logo icon">
            </div>

            <ul class="nav-links">
                <li><a href="home.html">Home</a></li>
                <li><a href="breeds.html">Breeds</a></li>
                <li><a href="care.html">Cat Care</a></li>
                <li><a href="fun.html">Fun Zone</a></li>
                <li><a href="about.html">About us</a></li>
            </ul>
        </nav>
    </header>  
  <div class="container-fluid">
  <div class="row vh-100">

    <div class="col-md-6 d-flex flex-column justify-content-center align-items-center text-center">
  <h1 class="fw-light">Welcome to Kittyrest!</h1>
  <form class="w-75" id="login-form">
    <h2 class="fw-light mb-4 text-start w-75">Log in to Kittyrest to save your favourites.</h2>
    <div class="mb-3 text-start">
      <label for="login" class="form-label">Your Name</label>
      <input type="text" class="form-control" id="login" name="login" autocomplete="username" required>
    </div>
    <div class="mb-3 text-start">
      <label for="password" class="form-label">Your Password</label>
      <input type="password" class="form-control" id="password" name="password" autocomplete="current-password" aria-describedby="password-requirements password-message" required>
    </div>
    <p id="password-requirements" class="password-requirements">
      Password must be at least 8 characters and include 2 uppercase letters, 1 number and 1 special character.
    </p>
    <p id="password-message" class="password-message" role="status" aria-live="polite"></p>

    <div class="text-center">
      <button type="submit" class="btn btn-log-in">Check password</button>
    </div>
  </form>

  <a href="https://uanimals.org" target="_blank" class="text-link mt-3">
    You can endow the organization to help them →
  </a>
</div>

    <div class="col-md-6 p-0">
      <img src="cat.jfif" class="cover-img" alt="Cat">
    </div>

  </div>
</div>
</body>
</html>
